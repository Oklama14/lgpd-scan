<li><strong>Controlador:</strong> A empresa, responsável pelas decisões sobre o tratamento.</li>
<li><strong>Encarregado (DPO):</strong> Pessoa responsável por atuar como canal.</li>
<p>Todo titular tem direito de acesso. Em todo caso, o encarregado responde em quinze
dias, e todo o tratamento observa a finalidade declarada nesta política.</p>
